name: Refresh agent tooling liveness
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: public-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts --prefix context
      - run: node --test tests
      - name: Generate signed tooling and context
        env:
          PREFLIGHT_SIGNING_KEY: ${{ secrets.PREFLIGHT_SIGNING_KEY }}
        run: |
          test -n "$PREFLIGHT_SIGNING_KEY"
          node tooling/check.mjs
          node context/index.mjs
      - name: Commit and publish public data with rebase retries
        run: bash scripts/publish-data.sh
      - name: Trigger Pages after publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "$GITHUB_REF_NAME"
